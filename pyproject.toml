[project]
name = "valorant-trn-mcp"
version = "0.1.0"
description = "Personal-use MCP server for Valorant stats scraped from tracker.gg"
readme = "README.md"
requires-python = ">=3.11"
# Keeps the project from ever being uploaded to a package index.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "patchright>=1.60",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
